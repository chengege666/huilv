<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能计算器 - 汇率转换、费用计算</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://w.wallhaven.cc/full/qr/wallhaven-qr27rq.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            padding: 20px 20px 0 20px;
        }
        
        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            flex-grow: 1;
            text-align: center;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-button.active {
            background: rgba(255, 255, 255, 0.9);
            color: #212529;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-grow: 1;
            width: 100%;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 450px;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calculator-container {
            width: 100%;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 25px;
            height: 100%;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .card-icon {
            background: #4361ee;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }
        
        .card-title {
            font-size: 24px;
            color: #212529;
            font-weight: 700;
        }
        
        .card-subtitle {
            font-size: 13px;
            color: #6c757d;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #212529;
            font-size: 14px;
        }
        
        .input-container {
            position: relative;
        }
        
        .input-field {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }
        
        .input-field:focus {
            border-color: #4895ef;
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        .select-field {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .select-field:focus {
            border-color: #4895ef;
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        .select-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 12px;
        }
        
        .swap-container {
            display: flex;
            justify-content: center;
            margin: 12px 0;
        }
        
        .swap-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #4361ee;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
        }
        
        .swap-btn:hover {
            background: #3f37c9;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(67, 97, 238, 0.4);
        }
        
        .swap-btn:active {
            transform: translateY(0);
        }
        
        .result-container {
            background: rgba(72, 149, 239, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .result-value {
            font-size: 26px;
            font-weight: 700;
            color: #4361ee;
            margin: 8px 0;
        }
        
        .result-label {
            font-size: 13px;
            color: #6c757d;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        
        .btn-primary {
            background: #4361ee;
            color: white;
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
        }
        
        .btn-primary:hover {
            background: #3f37c9;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(67, 97, 238, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: white;
            color: #4361ee;
            border: 2px solid #4361ee;
        }
        
        .btn-secondary:hover {
            background: rgba(67, 97, 238, 0.1);
        }
        
        .btn-icon {
            margin-right: 6px;
            font-size: 14px;
        }
        
        .last-updated {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: #6c757d;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 8px;
        }
        
        .loading-spinner {
            border: 3px solid rgba(67, 97, 238, 0.2);
            border-top: 3px solid #4361ee;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message, .detailed-result .error {
            color: #dc3545;
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
        }

        .detailed-result .error {
            background-color: #ffeaea;
            padding: 10px;
            border-radius: 4px;
        }
        
        .footer {
            text-align: center;
            color: white;
            padding: 25px;
            margin-top: auto;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .detailed-result {
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed #ccc;
            border-radius: 12px;
            background-color: #f9f9f9;
            text-align: left;
        }
        
        .detailed-result h3 {
            margin-bottom: 10px;
            color: #212529;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        
        .detailed-result p {
            margin: 8px 0;
        }

        .detailed-result .highlight {
            color: #e74c3c;
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .detailed-result small {
            display: block;
            margin-top: 10px;
            font-size: 12px;
            color: #6c757d;
        }
        
        /* 响应式设计 */
        @media (max-width: 576px) {
            .tabs-nav {
                max-width: 95%;
            }
            .tab-button {
                padding: 8px 10px;
                font-size: 0.9rem;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1><i class="fas fa-calculator"></i> 多功能计算器</h1>
        <p>汇率转换、费用计算一站式解决方案</p>
    </header>

    <nav class="tabs-nav">
        <button class="tab-button active" data-tab="exchange">汇率转换</button>
        <button class="tab-button" data-tab="cost">费用计算</button>
    </nav>
    
    <main class="main-container">
        <!-- 汇率转换标签 -->
        <section id="exchange" class="tab-content active">
            <div class="calculator-container">
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas fa-exchange-alt"></i>
                        </div>
                        <div>
                            <h2 class="card-title">汇率转换器</h2>
                            <p class="card-subtitle">实时汇率转换工具</p>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="amount">金额</label>
                        <div class="input-container">
                            <input type="number" class="input-field" id="amount" placeholder="请输入金额" value="" min="0.01" step="0.01">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="fromCurrency">从</label>
                        <div class="input-container">
                            <select class="select-field" id="fromCurrency">
                                <option value="CNY" selected>人民币 (CNY)</option>
                                <option value="USD">美元 (USD)</option>
                                <option value="EUR">欧元 (EUR)</option>
                                <option value="GBP">英镑 (GBP)</option>
                                <option value="JPY">日元 (JPY)</option>
                                <option value="CAD">加元 (CAD)</option>
                                <option value="AUD">澳元 (AUD)</option>
                                <option value="CHF">瑞士法郎 (CHF)</option>
                                <option value="HKD">港币 (HKD)</option>
                                <option value="KRW">韩元 (KRW)</option>
                                <option value="TWD">新台币 (TWD)</option>
                                <option value="SGD">新加坡元 (SGD)</option>
                                <option value="THB">泰铢 (THB)</option>
                            </select>
                            <span class="select-icon">▼</span>
                        </div>
                    </div>
                    
                    <div class="swap-container">
                        <button class="swap-btn" id="swapBtn" aria-label="交换货币">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M16 17L20 21M20 21L16 25M20 21H4M8 7L4 3M4 3L8 -1M4 3H20" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="toCurrency">到</label>
                        <div class="input-container">
                            <select class="select-field" id="toCurrency">
                                <option value="USD" selected>美元 (USD)</option>
                                <option value="CNY">人民币 (CNY)</option>
                                <option value="EUR">欧元 (EUR)</option>
                                <option value="GBP">英镑 (GBP)</option>
                                <option value="JPY">日元 (JPY)</option>
                                <option value="CAD">加元 (CAD)</option>
                                <option value="AUD">澳元 (AUD)</option>
                                <option value="CHF">瑞士法郎 (CHF)</option>
                                <option value="HKD">港币 (HKD)</option>
                                <option value="KRW">韩元 (KRW)</option>
                                <option value="TWD">新台币 (TWD)</option>
                                <option value="SGD">新加坡元 (SGD)</option>
                                <option value="THB">泰铢 (THB)</option>
                            </select>
                            <span class="select-icon">▼</span>
                        </div>
                    </div>
                    
                    <div class="result-container">
                        <div class="result-label">转换结果</div>
                        <div class="result-value" id="result">0.00</div>
                    </div>
                    
                    <div class="error-message" id="errorMessage"></div>
                    
                    <div class="loading" id="loading">
                        <div class="loading-spinner"></div>
                        <div>正在获取最新汇率...</div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="convertBtn">
                            <i class="fas fa-sync-alt btn-icon"></i>
                            转换货币
                        </button>
                        <button class="btn btn-secondary" id="refreshBtn">
                            <i class="fas fa-redo btn-icon"></i>
                            刷新汇率
                        </button>
                    </div>
                    
                    <div class="last-updated" id="lastUpdated">
                        最后更新: <span id="updateTime">正在获取...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 费用计算标签 -->
        <section id="cost" class="tab-content">
             <div class="calculator-container">
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                        <div>
                            <h2 class="card-title">费用计算器</h2>
                            <p class="card-subtitle">根据周期费用计算可用时长</p>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="cost-calc-total-amount">总金额（元）</label>
                        <div class="input-container">
                            <input type="number" class="input-field" id="cost-calc-total-amount" placeholder="请输入总金额" step="0.01" min="0.01">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="cost-calc-unit-cost">单位费用（元）</label>
                        <div class="input-container">
                            <input type="number" class="input-field" id="cost-calc-unit-cost" placeholder="请输入单位费用" step="0.01" min="0.01">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="cost-calc-time-unit">时间单位</label>
                        <div class="input-container">
                            <select class="select-field" id="cost-calc-time-unit">
                                <option value="hour">每小时</option>
                                <option value="day">每天</option>
                                <option value="month" selected>每月</option>
                                <option value="year">每年</option>
                            </select>
                            <span class="select-icon">▼</span>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="cost-calc-start-date">开始使用日期 (可选)</label>
                        <div class="input-container">
                            <input type="date" class="input-field" id="cost-calc-start-date">
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="cost-calc-button">
                            <i class="fas fa-calculator btn-icon"></i>
                            计算使用情况
                        </button>
                    </div>
                    
                    <div id="cost-calc-result" class="detailed-result"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>多功能计算器 © 2025 | 汇率数据为模拟数据，仅供参考</p>
    </footer>

    <script>
        // ========== 通用标签切换逻辑 ==========
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                // 移除所有激活状态
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                
                // 激活当前标签
                button.classList.add('active');
                const tabId = button.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ========== 汇率转换逻辑 ==========
        // 模拟汇率数据（实际项目中可替换为真实API）
        const exchangeRates = {
            CNY: { USD: 0.138, EUR: 0.127, GBP: 0.109, JPY: 20.3, CAD: 0.187, AUD: 0.212, CHF: 0.125, HKD: 1.08, KRW: 182, TWD: 4.28, SGD: 0.186, THB: 4.72 },
            USD: { CNY: 7.25, EUR: 0.92, GBP: 0.79, JPY: 147, CAD: 1.35, AUD: 1.53, CHF: 0.90, HKD: 7.82, KRW: 1320, TWD: 31.0, SGD: 1.35, THB: 34.2 },
            EUR: { CNY: 7.86, USD: 1.09, GBP: 0.86, JPY: 160, CAD: 1.47, AUD: 1.66, CHF: 0.98, HKD: 8.51, KRW: 1438, TWD: 33.7, SGD: 1.47, THB: 37.2 },
            GBP: { CNY: 9.17, USD: 1.27, EUR: 1.16, JPY: 185, CAD: 1.71, AUD: 1.91, CHF: 1.14, HKD: 9.88, KRW: 1670, TWD: 39.3, SGD: 1.71, THB: 43.3 },
            JPY: { CNY: 0.049, USD: 0.0068, EUR: 0.0062, GBP: 0.0054, CAD: 0.0091, AUD: 0.010, CHF: 0.0061, HKD: 0.053, KRW: 8.97, TWD: 0.21, SGD: 0.0091, THB: 0.23 },
            CAD: { CNY: 5.35, USD: 0.74, EUR: 0.68, GBP: 0.58, JPY: 110, AUD: 1.13, CHF: 0.66, HKD: 5.79, KRW: 978, THB: 25.3, SGD: 1.00, TWD: 22.9 },
            AUD: { CNY: 4.72, USD: 0.65, EUR: 0.60, GBP: 0.52, JPY: 94.8, CAD: 0.88, CHF: 0.58, HKD: 5.11, KRW: 860, THB: 22.3, SGD: 0.88, TWD: 20.2 },
            CHF: { CNY: 8.01, USD: 1.11, EUR: 1.02, GBP: 0.88, JPY: 164, CAD: 1.51, AUD: 1.72, HKD: 8.69, KRW: 1470, TWD: 34.3, SGD: 1.51, THB: 37.9 },
            HKD: { CNY: 0.925, USD: 0.128, EUR: 0.117, GBP: 0.101, JPY: 18.9, CAD: 0.173, AUD: 0.196, CHF: 0.115, KRW: 214, TWD: 4.97, SGD: 0.173, THB: 4.37 },
            KRW: { CNY: 0.0055, USD: 0.00076, EUR: 0.00069, GBP: 0.00060, JPY: 0.11, CAD: 0.0010, AUD: 0.0012, CHF: 0.00068, HKD: 0.0047, TWD: 0.023, SGD: 0.0010, THB: 0.026 },
            TWD: { CNY: 0.234, USD: 0.032, EUR: 0.030, GBP: 0.025, JPY: 4.76, CAD: 0.044, AUD: 0.049, CHF: 0.029, HKD: 0.201, KRW: 43.5, SGD: 0.044, THB: 0.11 },
            SGD: { CNY: 5.35, USD: 0.74, EUR: 0.68, GBP: 0.58, JPY: 110, CAD: 1.00, AUD: 1.13, CHF: 0.66, HKD: 5.79, KRW: 978, TWD: 22.9, THB: 25.3 },
            THB: { CNY: 0.212, USD: 0.029, EUR: 0.027, GBP: 0.023, JPY: 4.35, CAD: 0.039, AUD: 0.045, CHF: 0.026, HKD: 0.229, KRW: 38.3, TWD: 0.091, SGD: 0.039 }
        };

        // 更新时间
        const updateExchangeTime = () => {
            const now = new Date();
            document.getElementById('updateTime').textContent = now.toLocaleString('zh-CN');
        };

        // 交换货币
        document.getElementById('swapBtn').addEventListener('click', () => {
            const fromSelect = document.getElementById('fromCurrency');
            const toSelect = document.getElementById('toCurrency');
            const tempValue = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = tempValue;
            
            // 重新计算
            if (document.getElementById('amount').value) {
                convertCurrency();
            }
        });

        // 转换货币
        const convertCurrency = () => {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;
            const errorElement = document.getElementById('errorMessage');
            const resultElement = document.getElementById('result');

            // 清空错误
            errorElement.textContent = '';

            // 验证输入
            if (amount <= 0) {
                errorElement.textContent = ''; // 移除「请输入有效金额」的提示，避免输入过程中干扰
                resultElement.textContent = '0.00';
                return;
            }

            // 显示加载
            document.getElementById('loading').style.display = 'block';

            // 模拟API请求延迟
            setTimeout(() => {
                try {
                    const rate = exchangeRates[fromCurrency][toCurrency];
                    const result = (amount * rate).toFixed(2);
                    resultElement.textContent = result;
                    updateExchangeTime();
                } catch (e) {
                    errorElement.textContent = '获取汇率失败，请刷新重试';
                    resultElement.textContent = '0.00';
                } finally {
                    document.getElementById('loading').style.display = 'none';
                }
            }, 300); // 缩短加载延迟，提升输入体验
        };

        // 刷新汇率
        document.getElementById('refreshBtn').addEventListener('click', () => {
            document.getElementById('loading').style.display = 'block';
            setTimeout(() => {
                updateExchangeTime();
                document.getElementById('loading').style.display = 'none';
                // 重新计算当前值
                convertCurrency();
            }, 800);
        });

        // 绑定转换按钮
        document.getElementById('convertBtn').addEventListener('click', convertCurrency);

        // ========== 新增：自动触发转换的核心逻辑 ==========
        // 1. 金额输入框变化时自动转换
        document.getElementById('amount').addEventListener('input', convertCurrency);
        // 2. 「从」货币选择变化时自动转换
        document.getElementById('fromCurrency').addEventListener('change', convertCurrency);
        // 3. 「到」货币选择变化时自动转换
        document.getElementById('toCurrency').addEventListener('change', convertCurrency);

        // 初始化汇率时间
        updateExchangeTime();

        // ========== 费用计算逻辑 ==========
        document.getElementById('cost-calc-button').addEventListener('click', () => {
            const totalAmount = parseFloat(document.getElementById('cost-calc-total-amount').value) || 0;
            const unitCost = parseFloat(document.getElementById('cost-calc-unit-cost').value) || 0;
            const timeUnit = document.getElementById('cost-calc-time-unit').value;
            const startDate = document.getElementById('cost-calc-start-date').value;
            const resultElement = document.getElementById('cost-calc-result');

            // 验证输入
            if (totalAmount <= 0 || unitCost <= 0) {
                resultElement.innerHTML = '<div class="error">请输入有效的总金额和单位费用（大于0）</div>';
                return;
            }

            // 计算可用时长
            const totalUnits = (totalAmount / unitCost).toFixed(2);
            let endDate = '';
            
            // 如果有开始日期，计算结束日期
            if (startDate) {
                const start = new Date(startDate);
                const end = new Date(start);
                
                switch (timeUnit) {
                    case 'hour':
                        end.setHours(start.getHours() + parseFloat(totalUnits));
                        break;
                    case 'day':
                        end.setDate(start.getDate() + parseFloat(totalUnits));
                        break;
                    case 'month':
                        end.setMonth(start.getMonth() + parseFloat(totalUnits));
                        break;
                    case 'year':
                        end.setFullYear(start.getFullYear() + parseFloat(totalUnits));
                        break;
                }
                
                endDate = end.toLocaleDateString('zh-CN');
            }

            // 生成结果HTML
            let timeUnitText = {
                hour: '小时',
                day: '天',
                month: '个月',
                year: '年'
            }[timeUnit];

            let resultHTML = `
                <h3>计算结果</h3>
                <p>总金额：<strong>¥${totalAmount.toFixed(2)}</strong></p>
                <p>单位费用：<strong>¥${unitCost.toFixed(2)}/${timeUnitText}</strong></p>
                <p>可用时长：<span class="highlight">${totalUnits} ${timeUnitText}</span></p>
            `;

            if (startDate && endDate) {
                resultHTML += `
                    <p>开始日期：<strong>${new Date(startDate).toLocaleDateString('zh-CN')}</strong></p>
                    <p>预计结束日期：<strong>${endDate}</strong></p>
                `;
            }

            resultHTML += `<small>提示：结果基于输入数据计算，仅供参考</small>`;
            resultElement.innerHTML = resultHTML;
        });
    </script>
</body>
</html>
